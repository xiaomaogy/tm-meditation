<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TM">
    <meta name="theme-color" content="#FBF8F0">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>TM</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root { --gold:#FFC436; --fill-top:#F5D882; --fill-bot:#FBF8F0; }

        html, body { width:100%; height:100%; overflow:hidden; background:#FBF8F0; }
        body { font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif; color:#2c2c2c; user-select:none; -webkit-user-select:none; touch-action:manipulation; }

        /*
         * #app fills from physical top to physical bottom.
         * On notched iPhones in standalone mode, 100vh may stop at the safe area.
         * We layer multiple approaches so at least one covers everything:
         *   1) height:100%  — inherits from html/body (physical screen)
         *   2) min-height:100vh — fallback
         *   3) position:fixed inset:0 — belt-and-suspenders
         * The body bg (#FBF8F0) acts as final backstop for any uncovered pixel.
         */
        #app {
            position:fixed; top:0; left:0; right:0; bottom:0;
            display:flex; flex-direction:column;
            background:#FBF8F0;
        }

        #tab-content { flex:1; overflow:hidden; position:relative; }
        .tab-panel { display:none; height:100%; }
        .tab-panel.active { display:block; height:100%; }

        /* Tab bar — NO border, blends seamlessly into background */
        #tab-bar {
            display:flex; justify-content:space-around;
            padding:10px 0;
            padding-bottom:max(10px, env(safe-area-inset-bottom, 10px));
            background:#FBF8F0;
            flex-shrink:0;
        }
        .tab-btn { background:none; border:none; color:#999; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; cursor:pointer; }
        .tab-btn.active { color:var(--gold); }
        .tab-btn svg { width:22px; height:22px; }

        /* === TIMER PAGE === */
        .timer-page { position:absolute; top:0; left:0; right:0; bottom:0; overflow:hidden; background:#FBF8F0; }

        /* Gold fill */
        .fill-wrap { position:absolute; top:0; left:0; right:0; height:0%; z-index:1; pointer-events:none; }
        .fill-solid { width:100%; height:100%; background:var(--fill-top); }
        .fill-wave { position:absolute; bottom:-49px; left:0; width:100%; height:50px; }
        .fill-wave path { fill:var(--fill-top); }
        @keyframes sway { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.7)} }
        .fill-wave { animation: sway 6s ease-in-out infinite; transform-origin: top; }

        /* Idle UI */
        .idle-ui { position:absolute; top:0; left:0; right:0; bottom:0; z-index:2; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top, 0px) + 20px) 24px 20px; }
        .top-row { display:flex; justify-content:space-between; align-items:flex-start; }
        .gear-btn { background:none; border:none; color:#aaa; font-size:22px; cursor:pointer; }
        .mid-row { flex:1; display:flex; justify-content:space-between; align-items:center; }
        .dur-num { font-size:36px; font-weight:300; color:var(--gold); border-bottom:1.5px solid var(--gold); padding-bottom:2px; line-height:1.1; cursor:pointer; }
        .dur-type { font-size:32px; font-weight:700; margin-bottom:4px; }
        .toggle { width:52px; height:140px; background:var(--gold); border-radius:26px; position:relative; cursor:pointer; touch-action:none; flex-shrink:0; }
        .thumb { width:44px; height:44px; background:#fff; border-radius:50%; position:absolute; left:4px; top:4px; box-shadow:0 2px 8px rgba(0,0,0,.12); transition:top .3s cubic-bezier(.4,0,.2,1); }

        /* Scroll picker */
        .picker-bg { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.35); display:none; align-items:flex-end; z-index:100; }
        .picker-bg.open { display:flex; }
        .picker-sheet { background:#fff; border-radius:20px 20px 0 0; padding:20px 0; padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 20px); width:100%; }
        .picker-sheet h3 { text-align:center; font-size:17px; font-weight:600; margin-bottom:12px; }
        .picker-done { position:absolute; right:20px; top:20px; background:none; border:none; color:var(--gold); font-size:16px; font-weight:600; cursor:pointer; }
        .scroll-wrap { height:200px; overflow:hidden; position:relative; }
        .scroll-mask-top, .scroll-mask-bot { position:absolute; left:0; right:0; height:80px; pointer-events:none; z-index:2; }
        .scroll-mask-top { top:0; background:linear-gradient(#fff,transparent); }
        .scroll-mask-bot { bottom:0; background:linear-gradient(transparent,#fff); }
        .scroll-highlight { position:absolute; top:50%; left:20px; right:20px; height:40px; transform:translateY(-50%); border-top:1px solid #e0e0e0; border-bottom:1px solid #e0e0e0; pointer-events:none; z-index:1; }
        .scroll-list { height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; }
        .scroll-list::-webkit-scrollbar { display:none; }
        .scroll-item { height:40px; display:flex; align-items:center; justify-content:center; font-size:20px; color:#bbb; scroll-snap-align:center; transition:color .2s,transform .2s; }
        .scroll-item.active { color:#2c2c2c; font-weight:600; font-size:22px; }

        /* Running tap zone */
        .tap-zone { position:fixed; top:0; left:0; right:0; bottom:0; z-index:3; display:none; }

        /* Phase out label */
        .phase-label { position:absolute; top:0; left:0; right:0; bottom:0; z-index:2; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:300; color:rgba(0,0,0,.06); letter-spacing:4px; text-transform:lowercase; pointer-events:none; opacity:0; transition:opacity 1s; }

        /* Confirm overlay */
        .confirm-overlay { position:fixed; top:0; left:0; right:0; bottom:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.3); }
        .confirm-box { background:#fff; border-radius:20px; padding:28px 24px; width:280px; text-align:center; }
        .confirm-title { font-size:18px; font-weight:600; margin-bottom:8px; }
        .confirm-sub { font-size:14px; color:#888; margin-bottom:24px; }
        .confirm-btns { display:flex; gap:12px; }
        .confirm-btn { flex:1; padding:14px 0; border:none; border-radius:14px; font-size:15px; font-weight:500; cursor:pointer; }
        .confirm-btn.cancel { background:var(--gold); color:#fff; }
        .confirm-btn.quit { background:#e8e4d8; color:#2c2c2c; }

        /* Feedback */
        .feedback-page { position:fixed; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:#FBF8F0; }
        .fb-btn { padding:16px 40px; border:none; border-radius:28px; font-size:17px; font-weight:500; cursor:pointer; }
        #fb-yes { background:var(--gold); color:#fff; }
        #fb-no { background:#e8e4d8; color:#2c2c2c; }

        /* Settings */
        .settings-bg { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.35); display:none; align-items:flex-end; z-index:100; }
        .settings-bg.open { display:flex; }
        .settings-sheet { background:#fff; border-radius:20px 20px 0 0; padding:28px 20px; padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 28px); width:100%; }
        .settings-sheet h3 { text-align:center; font-size:17px; font-weight:600; margin-bottom:20px; }
        .s-row { display:flex; justify-content:space-between; padding:14px 0; border-bottom:1px solid #f0f0f0; font-size:15px; }
        .s-val { color:var(--gold); font-weight:600; }
        .clr-btn { margin-top:20px; width:100%; padding:14px; border:none; border-radius:14px; background:#fee; color:#c44; font-size:15px; cursor:pointer; }

        /* === STATS PAGE === */
        #stats-tab.active { display:block; overflow-y:auto; padding:calc(env(safe-area-inset-top, 0px) + 20px) 20px 20px; }
        .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
        .card { background:#fafafa; border-radius:14px; padding:16px 8px; text-align:center; }
        .card-v { font-size:24px; font-weight:700; }
        .card-v.g { color:var(--gold); } .card-v.b { color:#5b8def; } .card-v.gr { color:#5bbd6b; }
        .card-l { font-size:11px; color:#999; margin-top:4px; }
        .cal-sec { background:#fafafa; border-radius:16px; padding:16px; margin-bottom:20px; }
        .cal-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .cal-hd h3 { font-size:16px; font-weight:600; }
        .cal-nav { background:none; border:none; color:var(--gold); font-size:20px; cursor:pointer; padding:4px 10px; font-weight:600; }
        .cal-wk { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:8px; }
        .cal-wk span { font-size:11px; color:#999; font-weight:500; }
        .cal-days { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; gap:4px 0; }
        .cd { width:36px; height:36px; display:flex; align-items:center; justify-content:center; margin:0 auto; border-radius:50%; font-size:13px; }
        .cd.hs { background:var(--gold); color:#fff; font-weight:600; }
        .cd.td { border:1.5px solid var(--gold); }
        .sl h3 { font-size:16px; font-weight:600; margin-bottom:12px; }
        .si { display:flex; justify-content:space-between; align-items:center; background:#fafafa; border-radius:12px; padding:12px 14px; margin-bottom:8px; }
        .si-d { font-size:14px; } .si-t { font-size:12px; color:#999; margin-top:2px; }
        .si-dur { font-size:14px; font-weight:600; color:var(--gold); }
        .empty { text-align:center; color:#999; font-size:14px; padding:32px 0; }
    </style>
</head>
<body>
    <div id="app">
        <div id="tab-content">
            <div id="timer-tab" class="tab-panel active"></div>
            <div id="stats-tab" class="tab-panel"></div>
        </div>
        <nav id="tab-bar">
            <button class="tab-btn active" data-tab="timer">
                <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="4"/><ellipse cx="12" cy="17" rx="7" ry="5"/></svg>
                <span>Transcend</span>
            </button>
            <button class="tab-btn" data-tab="stats">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="4" width="4" height="17" rx="1"/></svg>
                <span>Progress</span>
            </button>
        </nav>
    </div>
    <script src="vendor/nosleep.min.js"></script>
    <script src="keep-awake.js"></script>
    <script src="app.js"></script>
</body>
</html>
